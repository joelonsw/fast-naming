# Fast-Naming AI Agent - Parallel Processing Workflow
# 병렬 처리 아키텍처: Phase 1 (스크래핑) → Phase 2 (개별 처리)

name: Naming Agent (Parallel)

on:
  schedule:
    # 3일마다 한국시간 22:00 (UTC 13:00) 실행
    - cron: '0 13 */3 * *'
  
  # 수동 실행 가능
  workflow_dispatch:

env:
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
  AI_GITHUB_TOKEN: ${{ secrets.AI_GITHUB_TOKEN }}
  SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
  NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
  NOTION_PARENT_PAGE_ID: ${{ secrets.NOTION_PARENT_PAGE_ID }}

jobs:
  # ============================================================
  # Phase 1: 공모전 목록 스크래핑
  # ============================================================
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      contests: ${{ steps.scrape.outputs.contests }}
      contest_count: ${{ steps.scrape.outputs.count }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'agent/requirements.txt'
      
      - name: Install dependencies
        run: |
          cd agent
          pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Install Playwright browsers
        run: |
          playwright install chromium
          playwright install-deps chromium
      
      - name: Scrape contests
        id: scrape
        run: |
          cd agent
          # 스크래핑 실행 및 결과 추출
          CONTESTS=$(python scrape_only.py 2>/dev/null)
          
          # 공모전 개수 확인
          COUNT=$(echo "$CONTESTS" | python -c "import sys,json; print(len(json.load(sys.stdin)))")
          echo "count=$COUNT" >> $GITHUB_OUTPUT
          
          # Matrix용 JSON 생성 (최대 5개로 제한)
          MATRIX=$(echo "$CONTESTS" | python -c "
          import sys, json
          contests = json.load(sys.stdin)[:5]  # 최대 5개
          # 각 공모전을 문자열로 변환하여 전달
          result = []
          for c in contests:
              result.append({
                  'url': c['url'],
                  'title': c['title'][:50]  # 제목 길이 제한
              })
          print(json.dumps(result))
          ")
          echo "contests=$MATRIX" >> $GITHUB_OUTPUT
          
          echo "📊 발견된 공모전: $COUNT개"
      
      - name: Summary
        run: |
          echo "## 🔍 Phase 1: 스크래핑 완료" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- 발견된 공모전: ${{ steps.scrape.outputs.count }}개" >> $GITHUB_STEP_SUMMARY

  # ============================================================
  # Phase 2: 개별 공모전 병렬 처리
  # ============================================================
  process:
    needs: scrape
    if: ${{ needs.scrape.outputs.contest_count != '0' && needs.scrape.outputs.contests != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    strategy:
      fail-fast: false  # 하나 실패해도 다른 것 계속 실행
      max-parallel: 2   # Rate limit 대응: 동시 2개만
      matrix:
        contest: ${{ fromJson(needs.scrape.outputs.contests) }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'agent/requirements.txt'
      
      - name: Install dependencies
        run: |
          cd agent
          pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Install Playwright browsers
        run: |
          playwright install chromium
          playwright install-deps chromium
      
      - name: Process contest
        run: |
          cd agent
          echo "🎯 처리 중: ${{ matrix.contest.title }}"
          python main.py --contest-url "${{ matrix.contest.url }}"
      
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: result-${{ strategy.job-index }}
          path: agent/results/
          retention-days: 30
          if-no-files-found: ignore
      
      - name: Summary
        if: always()
        run: |
          echo "## 🎯 공모전 처리 완료" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- 제목: ${{ matrix.contest.title }}" >> $GITHUB_STEP_SUMMARY
          echo "- URL: ${{ matrix.contest.url }}" >> $GITHUB_STEP_SUMMARY

  # ============================================================
  # Phase 3: 결과 집계
  # ============================================================
  aggregate:
    needs: [scrape, process]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      - name: Download all results
        uses: actions/download-artifact@v4
        with:
          pattern: result-*
          merge-multiple: true
          path: all-results
        continue-on-error: true
      
      - name: Final Summary
        run: |
          echo "## 🏆 Fast-Naming Agent 실행 완료" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- 스크래핑된 공모전: ${{ needs.scrape.outputs.contest_count }}개" >> $GITHUB_STEP_SUMMARY
          echo "- 실행 시간: $(date)" >> $GITHUB_STEP_SUMMARY
          if [ -d "all-results" ]; then
            echo "- 결과 파일: $(find all-results -type f | wc -l)개" >> $GITHUB_STEP_SUMMARY
          fi
