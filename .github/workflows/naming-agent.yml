# Fast-Naming AI Agent - Daily Workflow
# 매일 한국시간 22:00 (UTC 13:00) 자동 실행

name: Daily Naming Agent

on:
  schedule:
    # 3일마다 한국시간 22:00 (UTC 13:00) 실행
    # 매월 1, 4, 7, 10, 13, 16, 19, 22, 25, 28일
    - cron: '0 13 */3 * *'
  
  # 수동 실행 가능
  workflow_dispatch:

env:
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
  AI_GITHUB_TOKEN: ${{ secrets.AI_GITHUB_TOKEN }}  # GitHub AI
  SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
  NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
  NOTION_PARENT_PAGE_ID: ${{ secrets.NOTION_PARENT_PAGE_ID }}

jobs:
  run-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'agent/requirements.txt'
      
      - name: Install dependencies
        run: |
          cd agent
          pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Install Playwright browsers
        run: |
          playwright install chromium
          playwright install-deps chromium
      
      - name: Run Naming Agent
        run: |
          cd agent
          python main.py
      
      - name: Upload results artifact
        uses: actions/upload-artifact@v4
        with:
          name: agent-results-${{ github.run_number }}
          path: agent/results/
          retention-days: 30
          if-no-files-found: ignore
      
      - name: Summary
        if: always()
        run: |
          echo "## 🎯 Fast-Naming Agent 실행 완료" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- 실행 시간: $(date)" >> $GITHUB_STEP_SUMMARY
          echo "- 실행 번호: ${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          if [ -d "agent/results" ]; then
            echo "- 결과 파일: $(ls agent/results/ | wc -l)개" >> $GITHUB_STEP_SUMMARY
          fi
